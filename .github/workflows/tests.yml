name: tests

on:
  push:
    branches:
      - main
  pull_request:
  # Exposed so the deploy workflows can run these exact checks as a gate
  # rather than duplicating them and letting the two definitions drift.
  workflow_call:

permissions:
  contents: read

# A new push supersedes the run already in flight for the same ref.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    # Pest's browser plugin leaves an orphaned `playwright run-server` process
    # holding stdout open, which can keep a finished job alive until the 6 hour
    # default timeout. This caps the damage.
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: npm

      - name: Setup Application
        run: composer setup

      # tests/Browser runs in the default `php artisan test` suite, so CI needs
      # a real browser. Without this the smoke tests fail on a missing
      # executable rather than on anything to do with the application.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run CI Checks
        run: composer ci:check
